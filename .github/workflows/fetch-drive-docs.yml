name: fetch-drive-docs

# Temporary helper: the coding sandbox cannot reach Google Drive,
# so a runner fetches the source documents and extracts their text.
on:
  push:
    branches: [arena/01a08f24-erpagent]
    paths: ['.github/workflows/fetch-drive-docs.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a08f24-erpagent

      - name: Install poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download source documents
        run: |
          mkdir -p _raw
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          curl -sSL -A "$UA" -o _raw/omes-manual.pdf \
            "https://drive.usercontent.google.com/download?id=1i_sijglK_dkl6zFeojDHdr_hObKV93fB&export=download"
          curl -sSL -A "$UA" -o _raw/panan-architecture.docx \
            "https://drive.usercontent.google.com/download?id=132wEjLErEUa_p9R8nSSLRmVm83MKjwTw&export=download"
          ls -l _raw
          file _raw/*

      - name: Extract PDF text
        run: |
          pdftotext -layout _raw/omes-manual.pdf _extract_omes.txt
          pdfinfo _raw/omes-manual.pdf | head -20
          wc -l -c _extract_omes.txt

      - name: Extract DOCX text and media
        run: |
          python3 - <<'PY'
          import zipfile, re, pathlib, html
          src = pathlib.Path('_raw/panan-architecture.docx')
          z = zipfile.ZipFile(src)
          xml = z.read('word/document.xml').decode('utf-8', 'ignore')
          xml = re.sub(r'</w:p>', '\n', xml)
          xml = re.sub(r'<w:tab[^>]*/>', '\t', xml)
          xml = re.sub(r'<w:br[^>]*/>', '\n', xml)
          text = re.sub(r'<[^>]+>', '', xml)
          text = html.unescape(text)
          text = '\n'.join(line.rstrip() for line in text.splitlines())
          pathlib.Path('_extract_panan.txt').write_text(text, encoding='utf-8')
          media = [n for n in z.namelist() if n.startswith('word/media/')]
          pathlib.Path('_media_list.txt').write_text('\n'.join(media), encoding='utf-8')
          print('docx media entries:', len(media))
          PY
          mkdir -p _media
          python3 - <<'PY'
          import zipfile, pathlib
          z = zipfile.ZipFile('_raw/panan-architecture.docx')
          for n in z.namelist():
              if n.startswith('word/media/'):
                  p = pathlib.Path('_media') / pathlib.Path(n).name
                  p.write_bytes(z.read(n))
          PY
          ls -l _media | head -30
          wc -l -c _extract_panan.txt

      - name: Commit extract for pickup
        run: |
          set -e
          rm -rf _extract
          mkdir -p _extract
          mv _extract_omes.txt _extract/omes-manual.txt
          mv _extract_panan.txt _extract/panan-architecture.txt
          mv _media_list.txt _extract/docx-media-list.txt
          mv _media _extract/docx-media
          rm -rf _raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _extract
          git commit -m "chore: temporary extract of source documents for analysis"
          git push origin HEAD:arena/01a08f24-erpagent
          echo "=== EXTRACT OK ==="
          wc -l -c _extract/*.txt
